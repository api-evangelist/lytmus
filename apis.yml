name: Lytmus
description: Lytmus was a technical-interview and coding-assessment platform for
  hiring engineers. Candidates worked live in a browser-based, fully functional
  Ubuntu virtual machine (Terminal, editors, Chrome) so recruiters could run
  pair-programming phone screens and evaluate real coding skills across languages
  and full-stack scenarios, priced in per-session plans. Surfaced as a portfolio
  company of a16z and added to the API Evangelist network as a lead. Enrichment
  probing (2026-07-20) found no developer portal, API, documentation, or
  ./.well-known surface; the company was acquired by GitHub in 2019 and its
  product has since been shut down, so lytmus.io now serves stale content and
  lytmus.com is a parked, for-sale domain. No API artifacts exist to enrich.
